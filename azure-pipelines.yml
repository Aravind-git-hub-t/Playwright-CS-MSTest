trigger:
  branches:
    include:
      - ci-playwright

pr: none

pool:
  name: self-hosted-windows

variables:
  buildConfiguration: 'Release'

steps:

# Step 1: Install .NET SDK
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'
    includePreviewVersions: true

# Step 2: Restore NuGet packages (solution-level, .slnx)
- script: dotnet restore src/MSTest.Playwright.Sample.slnx
  displayName: 'Restore solution'

# Step 3: Build the solution
- script: dotnet build src/MSTest.Playwright.Sample.slnx --configuration $(buildConfiguration)
  displayName: 'Build solution'

# Step 4: Install Playwright browsers (CORRECT for MSTest + self-hosted)
- script: |
    dotnet build src/tests/E2ETests/E2ETests.csproj --configuration $(buildConfiguration)
    pwsh src/tests/E2ETests/bin/$(buildConfiguration)/net10.0/playwright.ps1 install
  displayName: 'Install Playwright browsers'

# Step 5: Run Playwright MSTest tests
- script: dotnet test src/tests/E2ETests/E2ETests.csproj --configuration $(buildConfiguration) --settings src/tests/E2ETests/test.runsettings
  displayName: 'Run Playwright MSTest tests'

# Step 6: Publish test results to Azure DevOps
- task: PublishTestResults@2
  displayName: 'Publish test results'
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    failTaskOnFailedTests: true
